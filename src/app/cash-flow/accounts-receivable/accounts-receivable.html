<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" class="w-full">
      <ng-container matColumnDef="client">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let element">{{ element.client }}</td>
      </ng-container>

      <ng-container matColumnDef="document">
        <th mat-header-cell *matHeaderCellDef>Documento</th>
        <td mat-cell *matCellDef="let element">{{ element.document }}</td>
      </ng-container>

      <ng-container matColumnDef="due_date">
        <th mat-header-cell *matHeaderCellDef>Fecha de vencimiento</th>
        <td mat-cell *matCellDef="let element">{{ element.dueDate }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Saldo pendiente</th>
        <td mat-cell *matCellDef="let element">{{ formatCurrency(element.amount) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <button
            type="button"
            mat-icon-button
            matTooltip="Amortizar deuda"
            aria-label="Amortizar deuda"
          >
            <mat-icon>savings</mat-icon>
          </button>
          <button
            type="button"
            mat-icon-button
            matTooltip="Cobrar deuda"
            aria-label="Cobrar deuda"
          >
            <mat-icon>payments</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnHeaders"></tr>
      <tr mat-row *matRowDef="let row; columns: columnHeaders"></tr>
    </table>
</div>
