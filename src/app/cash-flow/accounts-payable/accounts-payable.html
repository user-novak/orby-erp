<div class="py-6">
  @if (totalItems > 0) {
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" class="w-full">
        <ng-container matColumnDef="movement_date">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let element">
            {{ formatMovementDate(element.movement_date) }}
          </td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let element">{{ element.category.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let element">{{ element.description || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Saldo pendiente</th>
          <td mat-cell *matCellDef="let element">{{ formatAmount(element.amount) }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            <button
              type="button"
              mat-icon-button
              matTooltip="Amortizar deuda"
              aria-label="Amortizar deuda"
              (click)="openPaymentDialog(element, false)"
            >
              <mat-icon>savings</mat-icon>
            </button>
            <button
              type="button"
              mat-icon-button
              matTooltip="Pagar deuda"
              aria-label="Pagar deuda"
              (click)="openPaymentDialog(element, true)"
            >
              <mat-icon>payments</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnHeaders"></tr>
        <tr mat-row *matRowDef="let row; columns: columnHeaders"></tr>
      </table>

      <mat-paginator
        [length]="totalItems"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Seleccionar página de cuentas por pagar"
      >
      </mat-paginator>
    </div>
  } @else {
    <app-no-data
      [message]="'No hay cuentas por pagar'"
      [description]="'Las cuentas por pagar pendientes aparecerán aquí'"
      [icon]="'payments'"
    ></app-no-data>
  }
</div>
