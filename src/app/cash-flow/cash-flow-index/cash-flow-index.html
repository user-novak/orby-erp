<main class="module-main">
  <section class="mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (account of accounts; track account.name) {
      <div class="bg-white border border-gray-200 rounded-lg shadow p-5">
        <span class="block text-sm text-gray-500">{{ account.name }}</span>
        <strong class="block mt-2 text-xl text-gray-900">
          {{ formatCurrency(account.amount) }}
        </strong>
      </div>
    }

    <div class="bg-white border border-blue-500 rounded-lg shadow p-5">
      <span class="block text-sm font-medium text-blue-700">Saldo total</span>
      <strong class="block mt-2 text-xl text-gray-900">
        {{ formatCurrency(totalBalance) }}
      </strong>
    </div>
  </section>

  <section class="bg-white mat-elevation-z8">
    <mat-tab-group>
      <mat-tab label="Ingresos y egresos">
        <app-cash-flow-movement></app-cash-flow-movement>
      </mat-tab>

      <mat-tab label="Cuentas por cobrar">
        <app-accounts-receivable></app-accounts-receivable>
      </mat-tab>

      <mat-tab label="Cuentas por pagar">
        <app-accounts-payable></app-accounts-payable>
      </mat-tab>
    </mat-tab-group>
  </section>
</main>
