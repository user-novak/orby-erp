<main class="module-main">
  <div class="module_buttons">
    <button (click)="goToCreate()" matButton="filled">
      <mat-icon>add</mat-icon>
      Registrar nueva categoría
    </button>
  </div>

  @if (totalItems > 0) {
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Categoría</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let element">{{ getTypeLabel(element.type) }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let element">{{ getStatusLabel(element.status) }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            @if (isProtected(element.id)) {
              <button
                mat-icon-button
                disabled
                aria-label="Categoría protegida"
                title="Esta categoría predeterminada no se puede editar"
              >
                <mat-icon>lock</mat-icon>
              </button>
            } @else {
              <button
                (click)="goToEdit(element.id)"
                mat-icon-button
                aria-label="Editar categoría"
              >
                <mat-icon>edit</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="categoryColumnHeaders"></tr>
        <tr mat-row *matRowDef="let row; columns: categoryColumnHeaders"></tr>
      </table>

      <mat-paginator
        [length]="totalItems"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Seleccionar página de categorías"
      >
      </mat-paginator>
    </div>
  } @else {
    <app-no-data
      [message]="'No hay categorías registradas'"
      [description]="'Todavía no tienes categorías en el sistema. Cuando registres una, aparecerá aquí'"
      [icon]="'category'"
    ></app-no-data>
  }
</main>
