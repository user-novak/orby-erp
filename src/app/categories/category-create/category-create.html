<main class="module-main">
  <div class="w-full grid grid-cols-3 items-center">
    <div class="justify-self-start mx-8">
      <button (click)="goCategories()" mat-fab aria-label="Regresar" class="cursor-pointer">
        <mat-icon>keyboard_backspace</mat-icon>
      </button>
    </div>

    <h2 class="text-lg sm:text-2xl font-black text-center">Crear nueva categoría</h2>
  </div>

  <app-category-form (formSubmit)="createCategory($event)"></app-category-form>
</main>
