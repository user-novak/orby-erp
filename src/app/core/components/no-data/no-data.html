<div class="flex justify-center px-4 py-16">
  <div class="w-full max-w-lg rounded-xl border border-gray-200 bg-white px-8 py-12 text-center">
    <!-- Icono -->
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-blue-50">
      <mat-icon>{{ icon }}</mat-icon>
    </div>

    <!-- Mensaje principal -->
    <h2 class="text-xl font-semibold tracking-tight text-gray-900">
      {{ message }}
    </h2>

    <!-- Descripción -->
    <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-gray-500">
      {{ description }}
    </p>
  </div>
</div>
